services:
  - type: web
    name: wino-live-server
    runtime: node
    plan: free
    repo: https://github.com/cabtinhoma-cell/wino-live-server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: wino-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wino-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: wino-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wino-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: wino-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: wino-db
    plan: free
    databaseName: wino_live
